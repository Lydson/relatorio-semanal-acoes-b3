# Made by Lydson
# Salvar como: .github/workflows/atualizar_fundamentos.yml
#
# Toda semana baixa os dados abertos da CVM, recalcula os fundamentos e
# publica data/fundamentos.csv no repositorio. O Apps Script le esse CSV.
# Nao usa nenhum segredo: so o GITHUB_TOKEN automatico do proprio GitHub.

name: Atualizar fundamentos (CVM)

on:
  schedule:
    - cron: "0 6 * * 0"   # domingo 06:00 UTC = 03:00 em Brasilia
  workflow_dispatch:       # botao "Run workflow" para rodar na mao

permissions:
  contents: write          # necessario para o commit do CSV

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular fundamentos (CVM)
        run: python fundamentos_cvm.py

      - name: Registrar execucao (evita o GitHub desativar o agendamento por inatividade)
        run: date -u +"%Y-%m-%d %H:%M UTC" > data/ultima_atualizacao.txt

      - name: Publicar CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentos.csv data/ultima_atualizacao.txt
          git commit -m "Atualiza fundamentos (CVM)" || echo "Sem mudancas"
          git push